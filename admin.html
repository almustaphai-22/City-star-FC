<div class="card">
  <h2>Player Management</h2>
  <input id="pName" placeholder="Player Full Name">
  <input id="pJersey" placeholder="Jersey #">
  <input id="pContractYears" placeholder="Contract Years e.g. 2">
  <label>Who Pays Jersey?</label>
  <select id="jerseyPay"><option>Club Pays</option><option>Player Pays</option></select>
  <label>Who Pays Weekly Dues?</label>
  <select id="weeklyPay"><option>Player Pays</option><option>Club Pays</option></select>
  <button onclick="savePlayer()">Save Player Contract</button>
</div>

<script>
function savePlayer(){
  let data = {
    name: document.getElementById('pName').value,
    jersey: document.getElementById('pJersey').value,
    years: document.getElementById('pContractYears').value,
    jerseyPay: document.getElementById('jerseyPay').value,
    weeklyPay: document.getElementById('weeklyPay').value,
    coach: "Coach " + new URLSearchParams(window.location.search).get('name')
  }
  localStorage.setItem("player_"+data.name, JSON.stringify(data)); // temporary storage
  alert("Player Saved! " + data.name);
}
</script>
