<!DOCTYPE html>
<html>
<head>
  <title>Player Portal - City Star FC</title>
  <style>
    body{background:#004aad;color:white;font-family:Arial;padding:20px}
    h1{color:#FFD700;text-align:center}
  .card{background:rgba(0,0,0,0.4);padding:15px;border-radius:12px;margin-bottom:15px}
    h2{color:#FFD700} input{width:95%;padding:10px;border-radius:8px;border:none;margin:8px 0}
    button{background:#FFD700;color:#004aad;padding:10px;border:none;border-radius:8px;font-weight:bold;width:100%;margin-top:10px;cursor:pointer}
    button.green{background:green;color:white} button.red{background:red;color:white} button.blue{background:#00aaff;color:white}
  </style>
</head>
<body>
  <h1>⚽ PLAYER PORTAL</h1>

  <div id="loginForm" class="card">
    <h2>Player Login</h2>
    <input id="loginName" placeholder="Enter your full name">
    <button onclick="loginPlayer()">Login</button>
  </div>

  <div id="dashboard" style="display:none">
    <p id="welcome" style="text-align:center"></p> <!-- THIS WILL SAY WELCOME PLAYER -->
    <div class="card"><h2>Announcement</h2><p id="announcement">Loading...</p></div>
    <div class="card"><h2>MY CONTRACT OFFER</h2><div id="myContract">Loading...</div></div>
    <button onclick="logout()" class="red">Logout</button>
  </div>

  <script>
    function loginPlayer(){
      let name = document.getElementById('loginName').value;
      localStorage.setItem("currentPlayer", name);
      document.getElementById('loginForm').style.display='none';
      document.getElementById('dashboard').style.display='block';
      document.getElementById('welcome').innerText = "Welcome Player " + name; // FIXED: No more "Coach"
      loadContract(name);
    }
    
    function loadContract(playerName){
      let myData = JSON.parse(localStorage.getItem("player_"+playerName));
      if(myData && myData.status === "pending"){
        document.getElementById('myContract').innerHTML = `
          <b>CONTRACT OFFER FROM ${myData.coach}</b><br>
          Jersey: ${myData.jersey} <br> Years: ${myData.years} <br>
          Jersey Pay: ${myData.jerseyPay} <br> Weekly: ${myData.weeklyPay} <br><br>
          <button class="green" onclick="signContract('${playerName}')">I Agree & Sign</button>
          <button class="red" onclick="declineContract('${playerName}')">Decline</button>
          <button class="blue" onclick="showNegotiate()">Negotiate Terms</button>
          <div id="negotiateBox" style="display:none;margin-top:10px">
            <input id="newYears" placeholder="My Counter: Contract Years">
            <input id="newWeekly" placeholder="My Counter: Weekly Dues ₦">
            <button onclick="sendNegotiation('${playerName}')">Send to Coach</button>
          </div>
        `;
      } else if(myData && myData.status === "active"){
        document.getElementById('myContract').innerHTML = `<b>SIGNED CONTRACT</b><br>Welcome to City Star FC!`;
      } else {
        document.getElementById('myContract').innerText = "No contract offer yet. Contact Coach.";
      }
    }

    function showNegotiate(){ document.getElementById('negotiateBox').style.display='block'; }
    
    function sendNegotiation(name){
      let counter = {years: newYears.value, weekly: newWeekly.value, player: name};
      localStorage.setItem("negotiation_"+name, JSON.stringify(counter));
      alert("Negotiation sent to Coach! Wait for reply.");
    }

    function signContract(name){ /* same as before */ }
    function declineContract(name){ alert("You declined. Coach can send new offer."); }
    function logout(){ localStorage.removeItem("currentPlayer"); location.reload(); }
    
    // Auto login if already logged in
    if(localStorage.getItem("currentPlayer")) loginPlayer(localStorage.getItem("currentPlayer"));
  </script>
</body>
</html>
